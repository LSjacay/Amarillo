<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para Dafne - Noche Mágica 🌻🌙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stars-container"></div>
  <div class="moon"></div>
  
  <div class="header">
    <h1>Para Dafne 🌻</h1>
    <p>21 de septiembre — un árbol que florece con cada click</p>
  </div>
  
  <div class="controls">
    <button class="btn" id="musicBtn" title="Música de fondo">🔇</button>
  </div>
  
  <div class="counter" id="counter">LUCES: 0</div>

  <div class="tree" id="tree">
    <div class="canopy-bg"></div>
    <svg class="trunk" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0b2412"/>
          <stop offset="50%" stop-color="#1d5229"/>
          <stop offset="100%" stop-color="#0b2412"/>
        </linearGradient>
      </defs>
      <!-- Tronco más robusto -->
      <path d="M180,500 C175,380 185,280 200,220 C215,280 225,380 220,500 Z" fill="url(#trunkGrad)"/>
      <!-- Ramas extendidas a los lados -->
      <g fill="none" stroke="url(#trunkGrad)" stroke-linecap="round">
        <path d="M200,260 C150,210 90,170 30,130" stroke-width="14"/>
        <path d="M200,250 C160,180 120,130 110,60" stroke-width="10"/>
        <path d="M200,230 C200,160 200,100 200,40" stroke-width="12"/>
        <path d="M200,250 C240,180 280,130 290,60" stroke-width="10"/>
        <path d="M200,260 C250,210 310,170 370,130" stroke-width="14"/>
      </g>
    </svg>
    <div class="canopy" id="canopy"></div>
  </div>

  <div class="hills"></div>
  <div class="hint">Hace click en cualquier parte para que florezcan mas luces</div>

  <script src="script.js"></script>
</body>
</html>
